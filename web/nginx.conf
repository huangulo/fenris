server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Re-resolve the backend through Docker's embedded DNS instead of pinning the IP
    # seen at startup — otherwise a recreated fenris-server (new IP) 502s until web restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Proxy all /api/* requests to the backend
    location /api/ {
        # proxy_pass with a variable forces per-request resolution. The variable has no
        # URI part, so the original request URI (path + query) is passed through unchanged.
        set $fenris_api http://server:3200;
        proxy_pass $fenris_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    # SPA — fall through to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
